{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Vehicle Manager</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <style>
        body {
            margin: 0;
            min-height: 100vh;

            background-image: url("{% static 'images/background.jpg' %}");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        .navbar {
            background: rgba(0, 0, 0, 0.7) !important;
        }

        .navbar-brand,
        .nav-link {
            color: white !important;
        }
        .background-video {
    position: fixed;
    top: 0;
    left: 0;

    width: 100%;
    height: 100%;

    object-fit: cover;
    z-index: -1;
}
    </style>
</head>

<body>

<video class="background-video" autoplay muted loop playsinline aria-hidden="true">
    <source src="{% static 'videos/background.mp4' %}" type="video/mp4">
</video>

<nav class="navbar navbar-expand-lg">
    <div class="container-fluid">

        <a class="navbar-brand" href="{% url 'home' %}">
            Manager
        </a>

        <div class="navbar-nav">

            <a class="nav-link" href="{% url 'home' %}">
                Home
            </a>

            <a class="nav-link" href="{% url 'vehicle_list' %}">
                Car List
            </a>

            <a class="nav-link" href="{% url 'add_vehicle' %}">
                Add Vehicle
            </a>

            <a class="nav-link" href="{% url 'customer_history' %}">
                Customer History
            </a>

        </div>
    </div>
</nav>


<div class="container mt-4">
    {% block content %}
    {% endblock %}
</div>


<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

{% block extra_js %}
{% endblock %}

</body>
</html>
