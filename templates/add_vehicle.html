{% extends "base.html" %}
{% load static %}

{% block content %}
<div class="row justify-content-center"><div class="col-md-6">
    <h2>Add Vehicle</h2>
    <form id="vehicleForm" action="{% url 'add_vehicle' %}" method="post" enctype="multipart/form-data">
        {% csrf_token %}
        <div class="mb-3"><label class="form-label" for="vehicle_type">Vehicle Type</label><select id="vehicle_type" name="vehicle_type" class="form-select" required><option value="">Select type</option><option value="car">Car</option><option value="bike">Bike</option></select></div>
        <div class="mb-3"><label class="form-label" for="model_name">Model Name</label><input id="model_name" name="model_name" class="form-control" required></div>
        <div class="mb-3"><label class="form-label" for="registration_number">Vehicle Number</label><input id="registration_number" name="registration_number" class="form-control" placeholder="e.g. WB01AB1234" required></div>
        <div class="mb-3"><label class="form-label" for="fuel_type">Fuel Type</label><select id="fuel_type" name="fuel_type" class="form-select" required><option value="">Select fuel</option><option value="petrol">Petrol</option><option value="diesel">Diesel</option><option value="electric">Electric</option></select></div>
        <div class="mb-3"><label class="form-label" for="price">Price</label><input id="price" name="price" type="number" min="0" step="0.01" class="form-control" required></div>
        <div class="mb-3"><label class="form-label" for="picture">Vehicle Picture</label><input id="picture" name="picture" type="file" accept="image/*" class="form-control"></div>
        <button class="btn btn-primary" type="submit">Add Vehicle</button>
    </form>
    <p id="message" class="mt-3" aria-live="polite"></p>
    <div id="savedVehicleBox" class="card mt-3 d-none"><div class="card-body">
        <h3 class="h5">Vehicle saved</h3><p><strong>Number:</strong> <span id="savedRegistration"></span></p>
        <p><strong>Model:</strong> <span id="savedModel"></span></p><p><strong>Price:</strong> <span id="savedPrice"></span></p>
    </div></div>
</div></div>
{% endblock %}

{% block extra_js %}<script src="{% static 'js/vehicle.js' %}"></script>{% endblock %}
